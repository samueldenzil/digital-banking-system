server:
  port: 8084

spring:
  application:
    name: fraud-detection-service

  # Redis Configuration for OTP Caching
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration for SAGA Events
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

# OpenFeign Microservice Endpoints
application:
  clients:
    account-service:
      url: http://localhost:8081
  fraud:
    max-transaction-per-minute: 5
    suspicious-amount-multiplier: 5
    max-balance-percentage: 0.90

# Actuator Health Checkpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
